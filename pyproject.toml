[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halludetect"
version = "0.1.0"
description = "Lightweight hallucination detection for conversational responses."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["joblib", "numpy", "scikit-learn", "scipy"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
